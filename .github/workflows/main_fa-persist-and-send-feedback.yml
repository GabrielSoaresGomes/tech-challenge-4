name: Build and deploy Java project to Azure Function App - FA-persist-and-send-feedback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main_fa-persist-and-send-feedback.yml'
      - 'persist-and-send-feedback-function/**'

  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: FA-persist-and-send-feedback
  PACKAGE_DIRECTORY: './persist-and-send-feedback-function'
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Java Sdk ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 'Restore Project Dependencies Using Mvn'
        shell: pwsh
        run: |
          pushd '${{ env.PACKAGE_DIRECTORY }}'
          mvn clean package -Pprod
          popd
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D57539E1277F45A4A5E41CA929B5D0B3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_32410CD7ECC1457AB9034568E71D238B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE971032D14E423EB43C3AE516F10A77 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'FA-persist-and-send-feedback'
          slot-name: 'Production'
          package: 'persist-and-send-feedback-function/target/azure-functions/${{ env.AZURE_FUNCTIONAPP_NAME }}'
          respect-pom-xml: true
