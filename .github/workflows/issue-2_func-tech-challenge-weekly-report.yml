name: Build and deploy Java project to Azure Function App - func-tech-challenge-weekly-report

on:
  push:
    branches:
      - issue-2
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-tech-challenge-weekly-report # set this to your function app name on Azure
  PACKAGE_DIRECTORY: './generate-weekly-report-function/'    # set this to the directory which contains pom.xml file
  JAVA_VERSION: '17'                                        # set this to the java version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for requesting the JWT
      contents: read    # required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Java Sdk ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 'Restore Project Dependencies Using Mvn'
        shell: pwsh
        run: |
          pushd '${{ env.PACKAGE_DIRECTORY }}'
          mvn clean package
          popd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F079B43E98A240C58F87217809454B23 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_766B6DBF3A61496E8FE9FF659622B8AD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FD6F070A5CE5409D8D849FE796E6E522 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.PACKAGE_DIRECTORY }}
          respect-pom-xml: true
